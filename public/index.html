      --log-text: #C8C2E8;

    --surface: #1C1B2E;
    --surface2: #252338;

    --text: #EAE6F8;

    --log-text: #C8C2E8;

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;

    line-height: 1.6;

    padding-inline: 20px;

  .wrap {

    flex-direction: column;

  /* Header */

  .logo {

    font-weight: 700;

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);

  input[type="text"], input[type="password"] {

    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
    min-width: 0;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--accent);
  }
  input::placeholder { color: var(--text3); }

  .btn {
    padding: 10px 20px;
    background: var(--accent);
    color: var(--accent-text);

    border-radius: 8px;

<script>
// ─── STATE ──────────────────────────────────────────────────────────────────
let bookInfo = null;
let fetchedChapters = [];
let isFetching = false;
let shouldStop = false;
let epubBlob = null;

// ─── THEME ──────────────────────────────────────────────────────────────────
const root = document.documentElement;
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = root.getAttribute('data-theme');
  if (!cur) {
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', sysDark ? 'light' : 'dark');
  } else {
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  }
});

// ─── UI HELPERS ──────────────────────────────────────────────────────────────
function toggleAdvanced() {
  const panel = document.getElementById('advPanel');
  const label = document.getElementById('advLabel');
  const open = !panel.hidden;
  panel.hidden = open;
  label.textContent = open ? 'Advanced options' : 'Hide options';
}

function log(msg, type = 'info') {
  const box = document.getElementById('logBox');
  const line = document.createElement('span');
  line.className = `log-line ${type}`;
  const prefix = { ok: '✓', err: '✗', warn: '!', info: '·' }[type] || '·';
  line.textContent = `${prefix} ${msg}`;
  box.appendChild(line);
  box.appendChild(document.createElement('br'));
  box.scrollTop = box.scrollHeight;
}

function setProgress(cur, total) {
  const pct = total > 0 ? (cur / total) * 100 : 0;
  document.getElementById('progressBar').style.width = `${pct}%`;
  document.getElementById('progressCount').textContent = `${cur} / ${total}`;
}

function setProgressText(txt) {
  document.getElementById('progressText').textContent = txt;
}

function showCard(id) { document.getElementById(id).classList.remove('hidden'); }
function hideCard(id) { document.getElementById(id).classList.add('hidden'); }

function setChips(site) {
  ['zenithtls', 'peachtea'].forEach(s => {
    document.getElementById(`chip-${s}`).classList.toggle('active', s === site);
  });
}

// ─── PROXY ───────────────────────────────────────────────────────────────────
function getProxy() {
  return document.getElementById('proxyInput').value.trim() || 'https://corsproxy.io/?';
}

function getDelay() {
  return parseInt(document.getElementById('delayInput').value) || 350;
}

function getAuthToken() {
  return document.getElementById('authInput').value.trim();
}

async function proxyFetch(url, opts = {}) {
  const proxy = getProxy();
  const proxied = proxy + encodeURIComponent(url);
  const response = await fetch(proxied, opts);
  if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
  return response;
}

async function proxyJson(url, headers = {}) {
  const resp = await proxyFetch(url, { headers });
  return resp.json();
}

async function proxyText(url, headers = {}) {
  const resp = await proxyFetch(url, { headers });
  return resp.text();
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

const FALLBACK_PROXIES=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?','https://api.codetabs.com/v1/proxy?quest='];
async function ztFetch(url,asJson=false){
  try{const r=await fetch(url,{credentials:'include'});if(r.ok)return asJson?r.json():r.text();}catch(_){}
  const up=getProxy();const proxies=[up,...FALLBACK_PROXIES.filter(x=>x!==up)];
  let err;for(const pr of proxies){try{const r=await fetch(pr+encodeURIComponent(url));if(r.ok){log('Proxy ok','info');return asJson?r.json():r.text();}err=new Error('HTTP '+r.status);}catch(e){err=e;}}
  throw err||new Error('All proxies failed');
}

// ─── SITE DETECTION ──────────────────────────────────────────────────────────
function detectSite(url) {
  if (/zenithtls\.com/i.test(url)) return 'zenithtls';
  if (/peachtea\.agency/i.test(url)) return 'peachtea';
  return 'generic';
}

// ─── ZENITHTLS PARSER ────────────────────────────────────────────────────────
async function ztFetchBookInfo(url) {
  const id = url.split('/').pop().replace(/#.*$/, '');
  log(`Novel ID: ${id}`, 'info');

  const [chapters, meta] = await Promise.all([
    ztFetch(`https://zenithtls.com/api/chapter?novelId=${id}&limit=9999&page=1`,true),
    ztFetch(`https://zenithtls.com/api/novels/${id}`,true)
  ]);

  const free = (chapters.chapters || []).filter(c => c.price === 0 || c.price == null);

  return {
    site: 'zenithtls',
    title: meta.title || 'Unknown Title',
    author: meta.translator?.username || 'Unknown Translator',
    description: meta.synopsis || '',
    coverUrl: meta.cover?.url ? `https://zenithtls.com/${meta.cover.url}` : null,
    tags: (meta.tags || []).join(', '),
    chapterCount: free.length,
    total: chapters.total,
    chapters: free.map(c => ({
      id: c.id,
      title: c.title || `Chapter ${c.chapterNumber}`,
      url: `https://zenithtls.com/chapter/${c.id}`
    }))
  };
}

function parseNextjsScript(scriptText) {
  let json;
  const objMatch = scriptText.match(/\{[\s\S]*\}/);
  if (objMatch) {
    let raw = objMatch[0];
    // The parser strips backslash sequences before parsing
    raw = raw.replace(/\\\\\\\"/g, '\x00QUOT\x00');
    raw = raw.replace(/\\/g, '');
    raw = raw.replace(/\x00QUOT\x00/g, '\\"');
    json = JSON.parse(raw);
    json._fmt = 'obj';
  } else {
    const arrMatch = scriptText.match(/\[[\s\S]*\]/);
    if (!arrMatch) throw new Error('no JSON');
    json = JSON.parse(arrMatch[0]);
    json._fmt = 'arr';
  }
  return json;
}

async function ztFetchChapter(chapterUrl) {
  const html = await ztFetch(chapterUrl,false);
  const dom = new DOMParser().parseFromString(html, 'text/html');

  const MARKER = 'self.__next_f.push(';
  const scripts = [...dom.querySelectorAll('script')]
    .map(s => s.textContent)
    .filter(s => s.includes(MARKER));

  const parsed = [];
  let maxLen = 0, maxIdx = 0;

  for (const sc of scripts) {
    try {
      const j = parseNextjsScript(sc);
      if (sc.length > maxLen) { maxLen = sc.length; maxIdx = parsed.length; }
      parsed.push(j);
    } catch {}
  }

  if (parsed.length === 0) throw new Error('Could not parse Next.js data');

  const main = parsed[maxIdx];

  if (main._fmt === 'arr') {
    // Backslash/array format: find title from sibling objects
    let title = '';
    for (const p of parsed) {
      try { title = p.chapter?.title?.trim() || title; } catch {}
    }
    const key = main[0];
    const raw = main[key] || '';
    const lines = raw.replace(/\n\n+/g, '\n').split('\n').filter(l => l.trim());
    return { title, paragraphs: lines.filter(l => l !== title) };
  } else {
    // Object format
    const title = main.chapter?.title || '';
    const children = main.chapter?.content?.root?.children || [];
    const paragraphs = children
      .filter(c => c.direction != null)
      .map(c => (c.children || []).map(t => t.text || '').join(''));
    return { title, paragraphs };
  }
}

// ─── PEACHTEA PARSER ─────────────────────────────────────────────────────────
async function ptFetchBookInfo(url) {
  const id = url.match(/\/books\/(\d+)/)?.[1];
  if (!id) throw new Error('Could not extract book ID from URL');

  const auth = getAuthToken();
  if (!auth) throw new Error('peachtea.agency requires an auth token. Add it in Advanced options.');

  const headers = { Authorization: auth.startsWith('Bearer') ? auth : `Bearer ${auth}` };

  const meta = await proxyJson(`https://peachtea.agency/api/books/${id}`, headers);
  const book = meta.body || meta;

  const chaptersResp = await proxyJson(`https://peachtea.agency/api/books/${id}/chapters`, headers);
  const chapters = chaptersResp.body || chaptersResp.chapters || chaptersResp || [];

  return {
    site: 'peachtea',
    title: book.title || 'Unknown',
    author: book.author || book.translator || 'Unknown',
    description: book.description || book.synopsis || '',
    coverUrl: book.coverUrl || book.cover || null,
    chapterCount: chapters.length,
    total: chapters.length,
    chapters: chapters.map((c, i) => ({
      id: c.id || i,
      title: c.title || `Chapter ${i + 1}`,
      url: `https://peachtea.agency/api/books/${id}/chapters/${c.id || i}`
    }))
  };
}

async function ptFetchChapter(url) {
  const auth = getAuthToken();
  const headers = auth ? { Authorization: auth.startsWith('Bearer') ? auth : `Bearer ${auth}` } : {};
  const data = await proxyJson(url, headers);
  const ch = data.body || data;
  const content = ch.content || ch.body || '';
  const paragraphs = content.split('\n').filter(l => l.trim());
  return { title: ch.title || '', paragraphs };
}

// ─── GENERIC FALLBACK ────────────────────────────────────────────────────────
async function genericFetchBookInfo(url) {
  const html = await proxyText(url);
  const dom = new DOMParser().parseFromString(html, 'text/html');
  const title = dom.querySelector('h1')?.textContent?.trim() || dom.title || 'Unknown';

  // Try to find chapter links — look for anchor patterns
  const allLinks = [...dom.querySelectorAll('a[href]')];
  const chapterLinks = allLinks
    .filter(a => {
      const text = a.textContent.trim().toLowerCase();
      const href = a.href;
      return (text.match(/ch(apter)?\.?\s*\d+|episode\s*\d+|prologue|epilogue/i) ||
              href.match(/ch(apter)?\/?(\d+)|ep\/?(\d+)/i)) && href !== url;
    })
    .map(a => ({
      id: a.href,
      title: a.textContent.trim() || a.href.split('/').pop(),
      url: a.href
    }));

  const unique = [...new Map(chapterLinks.map(c => [c.url, c])).values()];

  return {
    site: 'generic',
    title,
    author: dom.querySelector('[rel="author"]')?.textContent?.trim() || 'Unknown',
    description: dom.querySelector('meta[name="description"]')?.content || '',
    coverUrl: null,
    chapterCount: unique.length,
    total: unique.length,
    chapters: unique
  };
}

async function genericFetchChapter(url) {
  const html = await proxyText(url);
  const dom = new DOMParser().parseFromString(html, 'text/html');

  // Remove nav/script/style
  ['nav','header','footer','script','style','aside'].forEach(tag => {
    dom.querySelectorAll(tag).forEach(el => el.remove());
  });

  const title = dom.querySelector('h1, h2')?.textContent?.trim() || '';
  const content = dom.querySelector('article, [class*="chapter"], [class*="content"], main') || dom.body;
  const paras = [...(content?.querySelectorAll('p') || [])]
    .map(p => p.textContent.trim())
    .filter(t => t.length > 10);

  return { title, paragraphs: paras };
}

// ─── ROUTER ──────────────────────────────────────────────────────────────────
async function fetchBookInfo(url) {
  const site = detectSite(url);
  setChips(site);
  if (site === 'zenithtls') return ztFetchBookInfo(url);
  if (site === 'peachtea') return ptFetchBookInfo(url);
  return genericFetchBookInfo(url);
}

async function fetchChapterContent(chapter, site) {
  if (site === 'zenithtls') return ztFetchChapter(chapter.url);
  if (site === 'peachtea') return ptFetchChapter(chapter.url);
  return genericFetchChapter(chapter.url);
}

// ─── EPUB BUILDER ────────────────────────────────────────────────────────────
function escXml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function buildEpub(info, chapters) {
  const zip = new JSZip();
  const uid = `bindery-${Date.now()}`;

  zip.file('mimetype', 'application/epub+zip', { compression: 'STORE', compressionOptions: { level: 0 } });

  zip.folder('META-INF').file('container.xml',
`<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
  </rootfiles>
</container>`);

  const oebps = zip.folder('OEBPS');

  oebps.file('style.css',
`body{font-family:Georgia,"Times New Roman",serif;margin:1.5em 2em;line-height:1.75;font-size:1em}
h1{font-size:1.3em;text-align:center;margin-bottom:2em;font-weight:600}
p{text-indent:1.5em;margin:.35em 0}
p:first-of-type{text-indent:0}`);

  const ids = [];
  for (let i = 0; i < chapters.length; i++) {
    const ch = chapters[i];
    const fileId = `ch_${String(i + 1).padStart(4, '0')}`;
    ids.push({ fileId, title: ch.title });

    const bodyContent = ch.paragraphs.map(p => `  <p>${escXml(p)}</p>`).join('\n');
    oebps.file(`${fileId}.xhtml`,
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <title>${escXml(ch.title)}</title>
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
  <h1>${escXml(ch.title)}</h1>
${bodyContent}
</body>
</html>`);
  }

  oebps.file('content.opf',
`<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="2.0" unique-identifier="BookId">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf">
    <dc:title>${escXml(info.title)}</dc:title>
    <dc:creator opf:role="aut">${escXml(info.author)}</dc:creator>
    <dc:language>en</dc:language>
    <dc:identifier id="BookId">${uid}</dc:identifier>
    <dc:description>${escXml(info.description)}</dc:description>
  </metadata>
  <manifest>
    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
    <item id="css" href="style.css" media-type="text/css"/>
${ids.map(c => `    <item id="${c.fileId}" href="${c.fileId}.xhtml" media-type="application/xhtml+xml"/>`).join('\n')}
  </manifest>
  <spine toc="ncx">
${ids.map(c => `    <itemref idref="${c.fileId}"/>`).join('\n')}
  </spine>
</package>`);

  oebps.file('toc.ncx',
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE ncx PUBLIC "-//NISO//DTD ncx 2005-1//EN" "http://www.daisy.org/z3986/2005/ncx-2005-1.dtd">
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
  <head>
    <meta name="dtb:uid" content="${uid}"/>
    <meta name="dtb:depth" content="1"/>
    <meta name="dtb:totalPageCount" content="0"/>
    <meta name="dtb:maxPageNumber" content="0"/>
  </head>
  <docTitle><text>${escXml(info.title)}</text></docTitle>
  <navMap>
${ids.map((c, i) => `    <navPoint id="${c.fileId}" playOrder="${i + 1}">
      <navLabel><text>${escXml(c.title)}</text></navLabel>
      <content src="${c.fileId}.xhtml"/>
    </navPoint>`).join('\n')}
  </navMap>
</ncx>`);

  return zip.generateAsync({
    type: 'blob',
    mimeType: 'application/epub+zip',
    compression: 'DEFLATE',
    compressionOptions: { level: 6 }
  });
}

// ─── MAIN FLOW ───────────────────────────────────────────────────────────────
async function lookupBook() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;

  document.getElementById('lookupBtn').disabled = true;
  document.getElementById('logBox').innerHTML = '';
  hideCard('bookCard');
  showCard('progressCard');
  hideCard('saveBtn');
  document.getElementById('stopBtn').classList.add('hidden');
  setProgress(0, 1);
  setProgressText('Looking up book…');

  try {
    log(`Fetching: ${url}`, 'info');
    bookInfo = await fetchBookInfo(url);
    log(`Found: ${bookInfo.title} — ${bookInfo.chapterCount} free chapters`, 'ok');

    // Populate book card
    document.getElementById('bookTitle').textContent = bookInfo.title;
    document.getElementById('bookAuthor').textContent = bookInfo.author;
    document.getElementById('bookDesc').textContent = bookInfo.description || '';

    const meta = document.getElementById('bookMeta');
    meta.innerHTML = '';
    const addPill = (text, hi) => {
      const p = document.createElement('span');
      p.className = 'meta-pill' + (hi ? ' highlight' : '');
      p.textContent = text;
      meta.appendChild(p);
    };
    addPill(`${bookInfo.chapterCount} chapters`, true);
    addPill(bookInfo.site);
    if (bookInfo.tags) addPill(bookInfo.tags);

    const coverEl = document.getElementById('coverEl');
    if (bookInfo.coverUrl) {
      coverEl.innerHTML = `<img src="${bookInfo.coverUrl}" alt="cover" onerror="this.parentElement.innerHTML='<span class=book-cover-placeholder>📖</span>'"/>`;
    }

    setProgress(1, 1);
    setProgressText('Ready');
    showCard('bookCard');
  } catch (err) {
    log(`Error: ${err.message}`, 'err');
    setProgressText('Lookup failed');
    console.error(err);
  }

  document.getElementById('lookupBtn').disabled = false;
}

async function startDownload() {
  if (!bookInfo || isFetching) return;

  isFetching = true;
  shouldStop = false;
  fetchedChapters = [];
  document.getElementById('logBox').innerHTML = '';
  document.getElementById('stopBtn').classList.remove('hidden');
  document.getElementById('saveBtn').classList.add('hidden');
  document.getElementById('downloadBtn').disabled = true;
  showCard('progressCard');

  const total = bookInfo.chapters.length;
  const d = getDelay();
  let failed = 0;

  setProgressText('Fetching chapters…');
  log(`Starting download: ${total} chapters`, 'info');

  for (let i = 0; i < bookInfo.chapters.length; i++) {
    if (shouldStop) { log('Stopped by user.', 'warn'); break; }

    const ch = bookInfo.chapters[i];
    setProgress(i, total);
    setProgressText(`Chapter ${i + 1} of ${total}…`);

    try {
      const content = await fetchChapterContent(ch, bookInfo.site);
      fetchedChapters.push({
        title: content.title || ch.title,
        paragraphs: content.paragraphs
      });
      if ((i + 1) % 10 === 0 || i === 0 || i === total - 1) {
        log(`Chapter ${i + 1}/${total}: ${content.title || ch.title}`, 'ok');
      }
    } catch (err) {
      failed++;
      log(`Chapter ${i + 1} failed: ${err.message}`, 'err');
      fetchedChapters.push({ title: ch.title, paragraphs: [`[Failed to fetch: ${err.message}]`] });
    }

    if (i < bookInfo.chapters.length - 1) await delay(d);
  }

  setProgress(total, total);

  if (fetchedChapters.length === 0) {
    log('No chapters downloaded. Check your proxy or auth token.', 'err');
    setProgressText('Download failed');
  } else {
    log(`Building EPUB (${fetchedChapters.length} chapters, ${failed} failed)…`, 'info');
    setProgressText('Building EPUB…');

    try {
      epubBlob = await buildEpub(bookInfo, fetchedChapters);
      const mb = (epubBlob.size / 1024 / 1024).toFixed(2);
      log(`EPUB ready — ${mb} MB`, 'ok');
      setProgressText('Done!');

      // Auto-save
      saveEpub();
      document.getElementById('saveBtn').classList.remove('hidden');
    } catch (err) {
      log(`EPUB build failed: ${err.message}`, 'err');
      console.error(err);
    }
  }

  isFetching = false;
  document.getElementById('stopBtn').classList.add('hidden');
  document.getElementById('downloadBtn').disabled = false;
}

function saveEpub() {
  if (!epubBlob) return;
  const filename = `${bookInfo.title.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_')}.epub`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(epubBlob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function stopFetching() {
  shouldStop = true;
  log('Stop requested — finishing current chapter…', 'warn');
}

function resetAll() {
  bookInfo = null;
  fetchedChapters = [];
  epubBlob = null;
  hideCard('bookCard');
  hideCard('progressCard');
  document.getElementById('urlInput').value = '';
  document.getElementById('logBox').innerHTML = '';
  ['zenithtls', 'peachtea'].forEach(s => document.getElementById(`chip-${s}`).classList.remove('active'));
}

// Enter key on URL input
document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookupBook();
});
</script>
